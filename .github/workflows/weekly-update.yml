name: weekly update

# Every Monday morning (India time) the tracker reads the week's new reports,
# rebuilds the rounds, checks and workbook, and commits whatever changed.
on:
  schedule:
    - cron: "30 3 * * 1"      # 03:30 UTC = 09:00 IST, Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read new reports and rebuild
        run: python -m funding_tracker update
        env:
          PYTHONPATH: src
      - name: Run the tests on the rebuilt data
        run: pytest -q
      - name: Commit the update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim data/processed data/reference reports docs/SOURCE_OF_TRUTH.md README.md
          if git diff --cached --quiet; then
            echo "Nothing new this week."
          else
            git commit -m "Weekly update $(date -u +%F)"
            git push
          fi
